esphome:
  platformio_options:
    build_flags:
      - "-DTHZ_504"

packages:
  COMMON: !include { file: common.yaml }
  BASE:   !include { file: wp_base.yaml }

  EXHAUST_AIR_DEWPOINT: !include { file: wp_temperature.yaml, vars: { property: "EXHAUST_AIR_DEWPOINT" }}
  DIFFERENTIAL_PRESSURE:       !include { file: wp_generic.yaml, vars: { property: "DIFFERENTIAL_PRESSURE"      , icon: "mdi:air-filter", unit: "Pa", update_interval: $interval_medium          }}
  FILTER_RUNTIME_DAYS: !include { file: wp_generic.yaml, vars: { property: "FILTER_RUNTIME_DAYS", icon: "mdi:air-filter", unit: "d" , update_interval: $interval_once_in_a_while }}

  # ======================================================================
  # Identified properties — cross-referenced against goelster Elster table
  # Run analyze-unknown-properties.ps1 after a menu-browsing session to discover more
  # ======================================================================

  # Refrigerant circuit sensors (identified via goelster/readings.go)
  HIGH_PRESSURE_DISPLAY:    !include { file: wp_generic.yaml, vars: { property: "HIGH_PRESSURE_DISPLAY",    icon: "mdi:gauge-high",             unit: "bar", update_interval: $interval_slow, accuracy_decimals: "1" }}  # ANZEIGE_HOCHDRUCK — raw=1643 (scale TBD, paired with LOW_PRESSURE_DISPLAY)
  COMPRESSOR_OUTPUT:        !include { file: wp_generic.yaml, vars: { property: "COMPRESSOR_OUTPUT",        icon: "mdi:engine",                 unit: "",    update_interval: $interval_slow, accuracy_decimals: "1" }}  # Compressor — raw=19 → 1.9 (speed/stage unit TBD)
  SUPERHEAT_EVAPORATOR:     !include { file: wp_generic.yaml, vars: { property: "SUPERHEAT_EVAPORATOR",     icon: "mdi:thermometer-chevron-up", unit: "K",   update_interval: $interval_slow, accuracy_decimals: "1" }}  # ISTWERT_UEBERHITZUNG_VERDAMPFER — raw=321..324 → 32.1..32.4 K
  SUPERHEAT_RECUPERATOR:    !include { file: wp_generic.yaml, vars: { property: "SUPERHEAT_RECUPERATOR",    icon: "mdi:thermometer-chevron-up", unit: "K",   update_interval: $interval_slow, accuracy_decimals: "1" }}  # ISTWERT_UEBERHITZUNG_REKUPERATOR_KUEHLEN — raw=382..383 → 38.2..38.3 K
  EXV_FEEDFORWARD:          !include { file: wp_generic.yaml, vars: { property: "EXV_FEEDFORWARD",          icon: "mdi:valve",                  unit: "%",   update_interval: $interval_slow, accuracy_decimals: "1" }}  # VORSTEUER_OEFFNUNGSGRAD — EXV feedforward opening degree — raw=168 → 16.8 %
  EXV_P_TERM:               !include { file: wp_generic.yaml, vars: { property: "EXV_P_TERM",               icon: "mdi:tune",                   unit: "",    update_interval: $interval_slow, accuracy_decimals: "1" }}  # P_ANTEIL_EXV — EXV P-controller term — raw=984..988 → 98.4..98.8
  EXV_D_TERM:               !include { file: wp_generic.yaml, vars: { property: "EXV_D_TERM",               icon: "mdi:tune",                   unit: "",    update_interval: $interval_slow, accuracy_decimals: "1" }}  # D_ANTEIL_EXV — EXV D-controller term — raw=1000 → 100.0
  CONTROL_DYNAMICS_FACTOR:  !include { file: wp_generic.yaml, vars: { property: "CONTROL_DYNAMICS_FACTOR",  icon: "mdi:chart-bell-curve",       unit: "",    update_interval: $interval_slow, accuracy_decimals: "1" }}  # FAKTOR_REGELDYNAMIK — raw=200 → 20.0

  # Error log readback (all fields belong to a single error log entry broadcast by the heat pump)
  ERROR_LOG_CODE:   !include { file: wp_generic.yaml, vars: { property: "ERROR_LOG_CODE",   icon: "mdi:alert-circle-outline", unit: "", update_interval: $interval_slow, accuracy_decimals: "0" }}  # FEHLERSPEICHER_FEHLERNUMMER — error code; raw=0..15
  ERROR_LOG_MINUTE: !include { file: wp_generic.yaml, vars: { property: "ERROR_LOG_MINUTE", icon: "mdi:clock-outline",        unit: "", update_interval: $interval_slow, accuracy_decimals: "0" }}  # FEHLERSPEICHER_MINUTE — error timestamp minute; raw=0..59
  ERROR_LOG_HOUR:   !include { file: wp_generic.yaml, vars: { property: "ERROR_LOG_HOUR",   icon: "mdi:clock-outline",        unit: "", update_interval: $interval_slow, accuracy_decimals: "0" }}  # FEHLERSPEICHER_STUNDE — error timestamp hour; raw=0..23
  ERROR_LOG_YEAR:   !include { file: wp_generic.yaml, vars: { property: "ERROR_LOG_YEAR",   icon: "mdi:calendar",            unit: "", update_interval: $interval_slow, accuracy_decimals: "0" }}  # FEHLERSPEICHER_JAHR — error timestamp year (2-digit); raw=26=2026

  # NOTE: UNKNOWN_027A was identified as GESPEICHERTE_FEHLER_LOESCHEN (Delete stored errors).
  # It is a write command, not a passive sensor — removed from binary sensors.
  # To clear the error log from HA, use the can_send_value action: property=0x027a, target=Kessel, raw_value=1
